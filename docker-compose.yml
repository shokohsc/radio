version: "3.9"

services:
  radio-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web-radio-server
    ports:
      - "8000:8000"
    volumes:
      # WARNING: Change this path to your music directory
      - ./music:/app/music:ro
    environment:
      - PORT=8000
      - MUSIC_DIR=/app/music
      - NODE_OPTIONS=--trace-warnings
    restart: unless-stopped
    # Run as non-root user (UID 1000 is the radio user in the container)
    user: radio
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  radio-ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: web-radio-ui
    ports:
      - "3000:8080"
    depends_on:
      - radio-server
    restart: unless-stopped
    # Run as non-root user
    user: caddy
    security_opt:
      - no-new-privileges:true
